[project]
name = "flickr-mcp"
version = "1.1.0"
description = "Connect Flickr to ChatGPT, Claude, Codex and Claude Code and any AI agent through Cotlet.dev, a hosted MCP server. No Flickr API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["flickr", "flickr api", "flickr mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/flickr-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=flickr"
Source = "https://github.com/cotlet-connect/flickr-mcp"

[project.scripts]
flickr-mcp = "flickr_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"flickr_agent.py" = "flickr_agent.py"

[tool.hatch.build.targets.sdist]
include = ["flickr_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
